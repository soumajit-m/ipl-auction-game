# IPL_AUCTION_AND_MANAGER_SECURITY_HARDENING_SPEC
# POLICY: 25-Point Production & R&D Security Checklist mapped to Next.js Custom Server, Socket.io, MongoDB & ONNX

FOUNDATIONS:
  1_code_ownership_and_clean_repo:
    policy: Enforce strict `.gitignore` rules and repository hygiene
    rules:
      - Ignore `.env*`, local MongoDB dumps, raw Cricsheet `.zip` archives, and temporary PyTorch checkpoints
      - Track only deterministic dataset outputs (`players_active.json`), verified `.onnx` weights, and typed source code
  2_secrets_management_and_rotation:
    policy: Zero hard-coded credentials in codebase or Antigravity prompts
    rules:
      - Load `MONGODB_URI`, `JWT_SECRET`, `HOST_ADMIN_HASH`, and `NEXT_PUBLIC_WS_URL` strictly via server environment variables
      - Validate required secrets at `server.ts` boot using `zod`; fail startup immediately if missing
      - Support zero-downtime key rotation via dual-key JWT verification (`JWT_SECRET_CURRENT`, `JWT_SECRET_PREVIOUS`)
  3_environment_separation:
    policy: Strict isolation between `development`, `staging`, and `production`
    rules:
      - Separate MongoDB databases/clusters per environment (`ipl_dev`, `ipl_staging`, `ipl_prod`)
      - Gate debug flags (`DEV_FAST_CLOCK`, raw AI valuation logs) strictly behind `NODE_ENV === "development"`
  4_dependency_patching_and_pinning:
    policy: Deterministic dependency tree across Node.js and Python ML pipelines
    rules:
      - Commit `package-lock.json` and `requirements.txt` with exact pinned versions (`onnxruntime-node`, `socket.io`, `mongoose`, `next`)
      - Audit dependencies via `npm audit` and `pip-audit` prior to builds
  5_build_and_deployment_pipeline_protection:
    policy: Immutable, reproducible CI/CD execution
    rules:
      - Run `npm ci`, TypeScript strict type-checking (`tsc --noEmit`), and `.onnx` checksum verification before deployment
      - Restrict production branch pushes and deployment triggers to verified maintainers

ACCESS:
  6_proven_authentication_system:
    policy: Cryptographically signed Host authentication + collision-safe Guest binding
    rules:
      - Authenticate Hosts via `Jose` / `NextAuth` using `HttpOnly`, `Secure`, `SameSite=Strict` JWT cookies and `bcrypt`/`argon2` password hashes
      - Bind Guests without passwords using composite token `HMAC_SHA256(roomCode + teamId + playerName + clientIP + deviceUUID, JWT_SECRET)`
  7_server_side_authorization:
    policy: Server-authoritative role and seat enforcement on every HTTP and WebSocket event
    rules:
      - Verify `socket.data.isHost === true` on the server before executing `[Force Save]`, `[Pause]`, `[Replace with AI]`, or `[Auto-Skip AI]`
      - Verify `socket.data.teamId === payload.teamId` before accepting any bid, skip toggle, wishlist submission, or Playing 11 swap
  8_tenant_and_room_isolation:
    policy: Complete state isolation across concurrent multiplayer rooms
    rules:
      - Scope all RAM lookups (`roomsMap.get(roomCode)`) and Socket.io broadcasts (`io.to(roomCode).emit(...)`) to the authenticated `roomCode`
      - Enforce `hostId` ownership filter on all MongoDB queries (`GameRoom.findOne({ roomCode, hostId: session.hostId })`)
  9_database_access_lockdown:
    policy: Least-privilege MongoDB network and user permissions
    rules:
      - Connect using a dedicated database user restricted to `readWrite` on the game database only (no `dbAdmin` or `dropDatabase` rights)
      - Enforce TLS/SSL connections and IP allowlisting on MongoDB Atlas
  10_hardened_sessions_tokens_and_recovery:
    policy: Short-lived tokens and hijack-resistant seat reclamation
    rules:
      - Set strict TTL expirations on Host JWTs and inactive RAM rooms (auto-evict idle rooms after flushing to MongoDB)
      - Require exact match of `roomCode + playerName + signed_deviceUUID_token` to reclaim a disconnected human seat; otherwise route to the "Claim an AI Franchise" picker

INPUTS_AND_DATA:
  11_server_side_input_validation:
    policy: Schema validation on 100% of REST payloads and Socket.io packets
    rules:
      - Validate every incoming event with `zod`:
        - `bid`: `{ lotId: z.string(), expectedPrice: z.number().multipleOf(0.25), bidAmount: z.number().multipleOf(0.25) }`[cite: 1]
        - `lineup`: Verify exactly 11 unique player IDs owned by that franchise, `OS <= 4`, `WK >= 1`, `bowlers >= 6`, and `totalOvers === 20`
  12_injection_and_unsafe_output_prevention:
    policy: Zero NoSQL injection and zero XSS vectors in team/guest names
    rules:
      - Enable `mongoose.set('sanitizeFilter', true)` and reject object/operator keys (`$gt`, `$where`, `$ne`) in query inputs
      - Strip HTML tags and control characters from Guest `displayName` and `roomCode` (restrict to `[a-zA-Z0-9_-]{2,20}`)
  13_cors_csrf_and_ssrf_restrictions:
    policy: Locked origin policies and zero outbound user-controlled fetches
    rules:
      - Configure Socket.io and Next.js CORS strictly to `ALLOWED_ORIGIN` (no wildcard `*` in production)
      - Enforce `SameSite=Strict` CSRF protection on `/api/rooms/*` mutations
      - Disable server-side URL fetching from client payloads (prevent SSRF)
  14_secure_file_and_model_storage:
    policy: Read-only static assets and validated model binaries
    rules:
      - Serve `players_active.json` and `.onnx` models from read-only server paths
      - Disable arbitrary user file uploads on the backend; handle R&D JSON exports purely client-side via `Blob` downloads
  15_sensitive_data_minimization_and_dto_sanitization:
    policy: Never leak hidden game state or PII over the network
    rules:
      - Hash client IP addresses (`SHA-256(ip + salt)`) before storing in MongoDB seat records
      - Run outbound `sanitizeRoomDTO()` on every broadcast to strip AI `z_DNA` vectors, `P_acc_vault`, private AI ticks, `M_value`, `M_tax_eff`, and Mode A provisional winners[cite: 1]

INTEGRITY:
  16_state_commitment_and_purse_integrity:
    policy: Atomic financial/purse ledger and optimistic concurrency locking
    rules:
      - Reject stale bids immediately if `req.expectedPrice !== lot.currentPrice` or `lot.state !== "OPEN"`[cite: 1]
      - Execute purse deductions (`Purse_curr_t - P_sold`) and squad insertions atomically inside the single-threaded commitment gate (`t = 5.0s`)[cite: 1]
      - Enforce V1.7 hard budget constraints (`Purse_phase_eff`, `Min_Slots_Cost = 0.20 * unfilled_below_18`) server-side[cite: 1]
  17_rate_limits_and_abuse_controls:
    policy: Per-socket and per-IP throttling against spam and DoS
    rules:
      - Enforce the V1.7 `1.5s_per_lot_per_human` cooldown on `[Unskip & Bid]` toggles[cite: 1]
      - Rate-limit Socket.io bid/filter packets to max `10 events/sec` per socket and room creation/join attempts to `15 req/min` per IP
      - Cap max concurrent active rooms in RAM and max sockets per room (`<= 15`)
  18_critical_user_journey_and_failure_mode_testing:
    policy: Automated verification of auction and match edge cases
    rules:
      - Test Mode A -> Mode B human unskip interruption at `t = 4.9s` (verify zero double-deduction or state mutation)[cite: 1]
      - Test simultaneous human bids at identical `expectedPrice` (verify exactly 1 winner, 1 optimistic-lock rejection)[cite: 1]
      - Test mid-lot human socket disconnect -> auto-pause -> Host `[Replace with AI]` handover
      - Test `MatchOverNet` ONNX failure fallback to analytical formula without crashing the room
  19_automated_security_scans:
    policy: Continuous static analysis on codebase
    rules:
      - Run ESLint security rules (`eslint-plugin-security`), TypeScript strict null checks, and secret scanning pre-commit
  20_human_review_of_ai_generated_code:
    policy: Mandatory human inspection of Antigravity-generated critical paths
    rules:
      - Manually verify `bidderAI.ts` purse clamping, `socketHub.ts` authorization guards, and Mongoose update queries before merging

OPERATIONS:
  21_structured_security_logging_without_secrets:
    policy: Audit trail for state mutations with zero secret/token exposure
    rules:
      - Log room creation, seat joins/reclaims, Host force-saves, invalid bid rejections, and auth failures using structured JSON (`pino`)
      - Redact `Authorization` headers, cookies, password hashes, and raw `deviceUUID` tokens from all logs
  22_monitoring_and_actionable_alerts:
    policy: Real-time telemetry on latency and memory bounds
    rules:
      - Track V1.7 per-lot evaluation latency (alert if `> 1.0ms`; target `< 0.2ms`)[cite: 1], ONNX batch inference time (`< 10ms`), active RAM room count, and MongoDB 7s auto-save error rates
  23_fail_closed_error_handling:
    policy: Every exception defaults to denying the mutation and preserving state
    rules:
      - If any error occurs during bid validation, Layer B affordability check, or Playing 11 swap, return `NO_BID` / reject the action and keep the previous valid room state intact[cite: 1]
      - Catch unhandled Socket.io handler exceptions per-event so a malformed packet from one client cannot crash the Node.js process
  24_backup_restore_and_rollback_testing:
    policy: Crash-resilient game recovery via 7-second MongoDB snapshots
    rules:
      - Persist schema version (`specVersion: "V1.7"`) in every MongoDB `GameRoom` document
      - Verify that a hard server restart + Host clicking `[RESUME Room]` on Screen 1 restores exact purses, squads, `mu_role` EMAs[cite: 1], wishlists, and match fixtures
  25_security_ownership_and_incident_plan:
    policy: Clear operational runbook and emergency kill-switches
    rules:
      - Designate Host/Admin controls to pause all active rooms, force-flush all dirty RAM states to MongoDB, revoke compromised room PINs, and roll back to the last verified deployment