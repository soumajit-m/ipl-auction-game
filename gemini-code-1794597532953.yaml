# IPL_AUCTION_BIDDING_AI_MASTER_SPEC_V1.7 (FINAL_LOCKED_SPEC)
# POLICY: O(1) live bidding (<0.2ms/lot), server-authoritative, hard Main/Acc budget split, zero unresolved ambiguities.

SYS_AUTH_FSM:
  net: Auth_WS_Server_Only | no_PeerJS | state_in_RAM | DTO_sanitized (strip_AI_ticks_ceilings_DNA_vault_provisional)
  concurrency: Optimistic_Lock (req: {lotId, expectedPrice, bidAmount}; reject_if expectedPrice != currentPrice)
  hard_constraints:
    purse_init: 120.00Cr
    squad_bounds: [18..25]
    max_overseas: 8
    min_wk_required: 1
    min_slot_cost: 0.20Cr_per_unfilled_slot_below_18
  phase_budget_partition (HARD_AI_RESTRICTION):
    - draw_multiplier_at_room_init:
        a_t = Uniform(0.70, 0.90)_seeded(roomPin, teamId, "MAIN_BUDGET_SPLIT")
    - phase_allocations:
        P_main_cap(t)  = round_2dec(a_t * 120.00)       # [84.00Cr .. 108.00Cr] strictly for MAIN_ROUND
        P_acc_vault(t) = round_2dec(120.00 - P_main_cap(t)) # [12.00Cr .. 36.00Cr] locked for 1ACC & 2ACC
    - active_phase_purse_ceiling:
        if(auction_phase == MAIN_ROUND):
          Purse_phase_eff(t) = max(0.00, Purse_curr_t - P_acc_vault(t)) # AI CANNOT touch P_acc_vault in Main Round
        elif(auction_phase in [ACC_ROUND_1, ACC_ROUND_2]):
          Purse_phase_eff(t) = Purse_curr_t # Full remaining purse (P_acc_vault + unspent Main) unlocked for 1acc & 2acc
  clock_and_step:
    lot_duration: 5.0s_fixed (elapsed_time t in [0.0s..5.0s])
    bid_increment: +0.25Cr_fixed (opening_bid_at_B_base, subsequent_bids_at_B_curr + 0.25)
    unskip_toggle_cd: 1.5s_per_lot_per_human

  human_skip_eval_order (evaluated_at_t_0.0s_lot_spawn):
    legally_eligible_pool_calc:
      rem_legal_pool(t) = rem_domestic_in_active_pool + min(rem_OS_in_active_pool, 8 - OS_cnt_t)
      rem_legal_WK(t)   = rem_domestic_WK_in_active_pool + ((OS_cnt_t < 8) ? rem_OS_WK_in_active_pool : 0)
    priority_hierarchy:
      1_Wishlist_Tick: if(p in human.wishlistIds) -> force_ACTIVE + UI_amber_glow (overrides_all_filters)
      2_Mandatory_WK_Guard: elif(WK_cnt_t == 0 and is_WK_p and rem_legal_WK(t) <= 2) -> force_ACTIVE + UI_wk_warn
      3_Mandatory_18_Guard: elif(rem_legal_pool(t) <= max(0, 18 - squad_len_t)) -> force_ACTIVE + UI_mandatory_warn
      4_Live_Server_Filter: elif(matches_filter(p, human.filterConfig_in_RAM)) -> set_AUTO_SKIPPED
      5_Default_Or_Manual: else -> set_ACTIVE (toggled_via_Master_Skip_Btn: ACTIVE <-> MANUAL_SKIPPED)

  resolution_modes:
    MODE_A_SILENT (all_humans_in_AUTO_SKIPPED_or_MANUAL_SKIPPED_at_t_0.0s):
      t_0.0s_provisional_calc (in_server_RAM_only_NO_state_mutation):
        - filter_AIs: keep_only_AIs_where(bid_state == ELIGIBLE and M_value >= B_base)
        - sort_eligible_AIs: order_by(M_value_desc, V_final_raw_desc, seeded_tiebreak_desc)
        - provisional_outcome:
            0_eligible_AIs: {status: UNSOLD, winner: null, P_sold: 0.00}
            1_eligible_AI:  {status: SOLD, winner: AI_1, P_sold: B_base}
            2+_eligible_AIs: {status: SOLD, winner: AI_1, P_sold: min(M_value_1, max(B_base, M_value_2 + 0.25))}
        - UI_broadcast_at_t_0.0s: {basePrice: B_base, mode: "ALL_HUMANS_SKIPPED", clock: 5.0}
      t_0.0s_to_5.0s_interruption_window (AMBIGUITY_3_RESOLVED):
        - if_human_clicks_Unskip_and_places_valid_bid_before_5.0s:
            1. discard_provisional_outcome (zero_side_effects)
            2. human_claims_opening_bid_at: B_curr = B_base (leading_bidder = human)
            3. transition_lot_to_MODE_B_LIVE_and_reset_lot_clock_to_5.0s
            4. if(AI_1_exists and M_value_1 >= B_base + 0.25):
                 schedule_AI_1_counter_bid(B_base + 0.25, after_ms = ai_reaction_delay_ms)
      t_5.0s_commitment_gate (executes_ONLY_if_uninterrupted_at_t_5.0s):
        - lock_lot_state = LOT_CLOSED
        - if(provisional_outcome.status == SOLD):
            deduct_purse(winner, provisional_outcome.P_sold) # Charged resolved P_sold, NEVER M_value_1
            append_squad(winner, p)
        - run_post_lot_updates(provisional_outcome) # Mutate ticks, role_cache, and mu_role ONLY here

    MODE_B_LIVE (at_least_one_human_ACTIVE_at_t_0.0s_OR_interrupted_from_MODE_A):
      - every_valid_bid_resets_lot_clock_to_5.0s
      - ai_active_ceiling: M_active = (tax_mode_active ? M_tax_eff : M_value)
      - ai_reaction_delay_ms:
          denom = max(B_base, M_active, 0.20)
          ratio = clip(B_curr / denom, 0.0, 1.0)
          delay_ms = 400 + 1500 * (ratio ^ 2) + Uniform(0, 200)_seeded(roomPin, teamId, lotId, B_curr)
      - on_clock_reaching_5.0s_without_new_bid:
          commit_live_sale_or_unsold -> run_post_lot_updates()

VALUATION_PIPELINE (SINGLE_PASS_LAYER_A):
  master_equation:
    V_core(t,p) = V_base(p) * M_DNA(t,p) * M_ground(t,p) * M_tick_mult(t,p) * M_scarcity(t,p) * (1.0 + mu_role[c_p])
    V_final(t,p) = max(0.0, V_core(t,p) + A_tick(t,p) + eps_tp)

  1_V_base (pluggable_interface):
    - default_fast_curve:
        V_base(p) = B_base + 0.018 * (max(0, OVR_p - 68) ^ 1.85) * (1.0 - 0.15 * InjRisk_p) * (1.0 - 0.08 * is_uncapped_low_sample)
    - optional_onnx_swap:
        MLP_4L_128H(player_vec) -> [mu_val, q15_floor, q85_ceil] weighted_by_DNA_z5

  2_M_DNA (bounded_franchise_identity_in_[0.80..1.25] — AMBIGUITY_1_RESOLVED):
    - vector_z[6]: [z1_star_vs_depth, z2_bat_vs_bowl, z3_patience, z4_youth_vs_exp, z5_risk_persistence, z6_home_bias]
    - room_init:
        z_drift = clip(z_base[team] + N(0, 0.08)_seeded(roomPin, teamId), -1.0, +1.0)
        stalemate_guard: for_lowest_2_z3_AI_teams -> z3 = clip(z3 - 0.25, -1.0, +1.0)
    - role_dir_z2(p):
        BAT_or_WK: +0.10 * z2 | PACE_or_SPIN: -0.10 * z2 | BAT_AR: +0.05 * z2 | BOWL_AR: -0.05 * z2 | BALANCED_AR: 0.00
    - raw_calc:
        M_DNA_raw = 1.0 + (OVR_p >= 86 ? 0.18*z1 : -0.12*z1) + role_dir_z2(p) + (age_p <= 24 ? 0.08*z4 : -0.05*z4)
    - bounded_output:
        M_DNA(t,p) = clip(M_DNA_raw, 0.80, 1.25)

  3_M_ground (stadium_synergy_in_[0.80..1.20]):
    - G_tp: dot(Stadium_S_t[spin,pace,power,dew], Player_P_p[4]) in [-1.0..+1.0]
    - P_home_bias: (z6_home_bias + 1.0) / 2.0 in [0.0..1.0]
    - slot_decay: [1.0, 1.0, 0.5, 0.0] for [1st, 2nd, 3rd, 4th+] specialist_in_squad
    - calc: M_ground(t,p) = clip(1.0 + (0.20 * P_home_bias * G_tp * slot_decay), 0.80, 1.20)

  4_Tick_Modifiers (separated_multiplicative_and_additive_terms):
    - gen_at_room_create: 30_players/AI_in_RAM | 70%_fixed(4_icons + 6_top_G_tp) + 30%_seeded(12_mid_79_85 + 8_uncapped)
    - overlap_rule: 2_to_4_teams_per_marquee | UI_buzz_badge_if(total_human_plus_AI_ticks >= 3)
    - tier_mapping:
        Tier_1_Priority (10_players): M_tick_mult = 1.30 | A_tick = 0.00Cr
        Tier_2_Backup   (12_players): M_tick_mult = 1.12 | A_tick = 0.00Cr
        Tier_3_Sleeper  (8_players):  M_tick_mult = 1.00 | A_tick = +0.50Cr
        Unticked:                     M_tick_mult = 1.00 | A_tick = 0.00Cr

  5_M_scarcity (soft_strategic_role_targets_with_WK_emergency_boost — AMBIGUITY_2_RESOLVED):
    - soft_role_targets (20_player_reference): {WK: 2, BAT: 6, AR: 4, PACE: 5, SPIN: 3}
    - rules:
        if(is_WK_p and WK_cnt_t == 0 and rem_legal_WK(t) <= 3):           M_scarcity = 1.50 # Emergency_WK_lock
        elif(role_cnt < target and rem_elite_role_in_active_pool <= 3):   M_scarcity = 1.20
        elif(role_cnt == 0 and lot_idx > 120):                            M_scarcity = 1.35
        elif(role_cnt >= target):                                         M_scarcity = 0.55
        else:                                                             M_scarcity = 1.00

  6_mu_role (5_role_isolated_EMAs_with_zero_human_guard):
    - buckets: [BAT, WK, AR, PACE, SPIN] in [-0.20..+0.25] (updated_ONLY_at_lot_commitment)
    - human_skip_ratio:
        r_skip = (total_humans > 0) ? (humans_skipped_on_lot / total_humans) : 0.0
    - on_committed_SOLD:
        mu_role[c] = clip(0.80 * mu_role[c] + 0.20 * ((P_sold - V_base) / max(0.20, V_base)), -0.20, +0.25)
    - on_committed_UNSOLD (only_if_OVR_p >= 82):
        mu_role[c] = clip(mu_role[c] - 0.08 * (1.0 - 0.5 * r_skip), -0.20, +0.25)
    - s_tier_intrinsic_floor:
        if(OVR_p >= 88): V_final(t,p) = max(V_final(t,p), 0.85 * V_base(p))

  7_eps_tp (tier_scaled_seeded_noise):
    - sigma_eps = min(0.50, 0.25 * B_base)
    - eps_tp = Uniform(-sigma_eps, +sigma_eps)_seeded(roomPin, teamId, playerId, "VAL_NOISE")

PORTFOLIO_RESERVATION_AND_PHASE_SCOPED_TICK_CACHE:
  1_phase_clamped_purse_reservation (AMBIGUITY_4_AND_HARD_SPLIT_RESOLVED):
    - P_patience = clip((z3_patience + 1.0) / 2.0, 0.0, 1.0)
    - mandatory_wk_slot_reserve = (WK_cnt_t == 0 and not is_WK_p) ? 1 : 0
    - Min_Slots_Cost(t) = 0.20 * max(mandatory_wk_slot_reserve, 18 - squad_len_t - 1)
    - Max_Spendable_Now(t) = max(0.0, Purse_phase_eff(t) - Min_Slots_Cost(t)) # Uses Purse_phase_eff(t) (a*120 in Main; rest in 1acc/2acc)
    - Reserve_raw(t) = P_patience * sum_{k in Tier1_Ticks_in_ActivePhasePool(t)} (0.75 * V_base(k))
    - panic_unlock:
        open_star_slots = max(0, 2 - count(p in squad_t where OVR_p >= 86 and role == c_p))
        if(rem_elite_role_in_active_pool <= open_star_slots): Reserve_raw(t) = 0.0
    - capped_reservation:
        Reserve_capped(t) = min(Reserve_raw(t), max(0.0, Max_Spendable_Now(t) - B_base))
    - Purse_avail(t,p) = Max_Spendable_Now(t) - (is_unticked ? Reserve_capped(t) : 0.0)

  2_phase_scoped_tick_promotion_heap (O(1)_lookup_on_hammer_fall):
    - scope_rule:
        MAIN_ROUND: `Unticked_Role_Heap[teamId][role]` indexes ONLY `YetToCome` main_pool_players
        ACC_ROUND_1_or_2_START: rebuild `Unticked_Role_Heap[teamId][role]` from nominated `Unsold` acc_pool_players
    - on_lot_commitment (SOLD_or_UNSOLD):
        lazy_pop_resolved_player_from_top_of_heaps
        if(status == SOLD):
          winner_t: remove_tick(p); if(role_cnt >= target) downgrade_rem_role_ticks_to_Tier2(1.12x)
          for_each_loser_AI_that_had_Tier1_tick(p):
            pop_top_valid_candidate_from `Unticked_Role_Heap[loser_AI][c_p]` -> promote_to_Tier1(1.30x)

  3_bargain_and_budget_preservation:
    - bargain_override:
        if(is_unticked and B_curr < 0.65 * V_base(p) and role_cnt < target + 1):
          V_final(t,p) = max(V_final(t,p), min(0.65 * V_base(p), Max_Spendable_Now(t)))
    - budget_preservation (non_exhaustion_once_18+_and_soft_targets_met):
        if(squad_len_t >= 18 and WK_cnt_t >= 1 and all_5_soft_role_targets_met):
          if_not(OVR_p >= squad_role_avg_OVR + 3 OR B_curr <= 0.60 * V_base(p)):
            force_bid_state = NO_BID

HARD_CLAMP_LAYER_B_AND_TAX_MODE:
  1_quantization_with_explicit_NO_BID_state:
    - hard_illegality_gate:
        last_slot_needs_wk = (squad_len_t == 24 and WK_cnt_t == 0 and not is_WK_p)
        last_18_slot_needs_wk = (WK_cnt_t == 0 and not is_WK_p and rem_legal_WK(t) <= 1)
        if(squad_len_t >= 25 OR (is_OS_p and OS_cnt_t >= 8) OR last_slot_needs_wk OR last_18_slot_needs_wk):
          return {bid_state: NO_BID, M_value: null, M_tax_eff: null}
    - effective_cap = min(V_final(t,p), Purse_avail(t,p))
    - lower_bound_affordability_gate:
        if(effective_cap < B_base):
          return {bid_state: NO_BID, M_value: null, M_tax_eff: null}
    - quantized_value_ceiling:
        M_value = B_base + 0.25 * floor((effective_cap - B_base) / 0.25)
        return {bid_state: ELIGIBLE, M_value: M_value}

  2_deterministic_human_tax_mode (bounded_by_Max_Spendable_Now_in_active_phase):
    - eligibility_triggers (ALL_REQUIRED):
        bid_state == ELIGIBLE
        leading_bidder_is_Human == true
        Human_Purse > 0.90 * Purse_curr_t
        OVR_p >= 85 and G_tp >= 0.0 and role_cnt_t < target
    - hard_clamped_tax_bound:
        raw_tax_cap = min(M_value + 1.50, Purse_avail(t,p), Max_Spendable_Now(t))
        M_tax_max = B_base + 0.25 * floor((raw_tax_cap - B_base) / 0.25)
    - smooth_deterministic_dropout:
        if(M_tax_max <= M_value):
          M_tax_eff = M_value
        else:
          u_tax = Uniform(0.0, 1.0)_seeded(roomPin, teamId, playerId, "TAX_DRAW")
          exponent = clip(1.5 - 0.5 * z5_risk_persistence, 0.75, 2.00)
          tax_span = (M_tax_max - M_value) * (u_tax ^ exponent)
          M_tax_eff = B_base + 0.25 * floor((M_value + tax_span - B_base) / 0.25)

  3_tactical_early_exit:
    - if(B_curr > V_base(p) and z5_risk_persistence < 0.0 and Unticked_Role_Heap[t][c_p].not_empty()):
        u_exit = Uniform(0.0, 1.0)_seeded(roomPin, teamId, playerId, "EARLY_EXIT")
        exit_thresh = 0.35 * abs(z5_risk_persistence) * ((B_curr - V_base(p)) / max(0.25, M_value - V_base(p)))
        if(u_exit < exit_thresh): trigger_exit_and_promote_heap_top()